schema = 1
name = "Solitaire"

[runtime]
kind = "node"
version = "24"
package_manager = "npm"

[[setup.steps]]
kind = "dependencies"
locked = true

[[setup.steps]]
run = ["npm", "run", "build"]

[launch]
command = ["npm", "run", "preview", "--", "--outDir", "solitaire", "--host", "{host}", "--port", "{port}", "--strictPort"]
host = "127.0.0.1"
port = 4173

[health]
type = "http"
path = "/"
timeout_seconds = 90

[persistence]
# Games are session-only; no repository-relative user data is written.
paths = []
